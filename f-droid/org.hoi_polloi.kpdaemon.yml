Categories:
  - System
License: AGPL-3.0-only
SourceCode: https://github.com/bfix/kpclientd-android
IssueTracker: https://github.com/bfix/kpclientd-android/issues

RepoType: git
Repo: https://github.com/bfix/kpclientd-android.git

AutoName: Katzenpost client daemon

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: 'v1.0.0-beta.5'
    subdir: apk
    ndk: 'r28'
    gradle:
      - yes
    forceversion: true
    srclibs:
      - "katzenpost@main"
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - cd ../../srclib/katzenpost
      - export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
      - export CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
      - export GOOS=android
      - export GOARCH=arm64
      - export CGO_ENABLED=1
      - mkdir -p /tmp/go-bin-build
      - go build -o /tmp/go-bin-build/kpclientd ./cmd/kpclientd
      - cd ../../org.hoi_polloi.kpdaemon/apk
      - mkdir -p ~/.gradle/init.d
      - echo "allprojects {" > ~/.gradle/init.d/inject-go-assets.gradle
      - echo "    afterEvaluate { project ->" >> ~/.gradle/init.d/inject-go-assets.gradle
      - echo "        if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {" >> ~/.gradle/init.d/inject-go-assets.gradle
      - echo "            project.android.sourceSets.main.assets.srcDirs += project.file('/tmp/go-bin-build')" >> ~/.gradle/init.d/inject-go-assets.gradle
      - echo "        }" >> ~/.gradle/init.d/inject-go-assets.gradle
      - echo "    }" >> ~/.gradle/init.d/inject-go-assets.gradle
      - echo "}" >> ~/.gradle/init.d/inject-go-assets.gradle
      - echo "org.gradle.configuration-cache=false" >> ~/.gradle/gradle.properties
      - export GRADLE_OPTS="-Dorg.gradle.configuration-cache=false"
