Categories:
  - System
License: AGPL-3.0-only
SourceCode: https://github.com/bfix/kpclientd-android
IssueTracker: https://github.com/bfix/kpclientd-android/issues

RepoType: git
Repo: https://github.com/bfix/kpclientd-android.git

AutoName: Katzenpost client daemon

Builds:
  - versionName: '1.0.0-beta.3'
    versionCode: 1
    commit: 'v1.0.0-beta.3'
    subdir: apk
    ndk: 'r28'
    gradle:
      - yes
    srclibs:
      - "katzenpost@main"
    prebuild:
      - find . -name "gradle-wrapper.properties" -exec sed -i 's/9.5.0/8.7/g' {} \;
      - cd ../../srclib/katzenpost
      - export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
      - export CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
      - export GOOS=android
      - export GOARCH=arm64
      - export CGO_ENABLED=1
      - go build -o ../../org.hoi_polloi.kpdaemon/apk/app/src/main/assets/kpclientd ./cmd/kpclientd
      - cd ../../org.hoi_polloi.kpdaemon/apk
